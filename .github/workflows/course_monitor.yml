name: Course Availability Monitor

on:
  schedule:
    # Run every 30 minutes
  - cron: '*/30 * * * *

     # Allow manual trigger via GitHub Actions UI
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    # Set environment variables from GitHub Secrets
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}

    steps:
      # Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # Install dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Execute the course checker script
      - name: Run course availability checker
        run: python course_checker.py

      # Optional: Log job status on failure
      - name: Notify failure
        if: failure()
        run: |
          echo "Course checker execution failed at $(date)"
          exit 1
